  // CSS properties where a bare number is legitimately unitless (mirrors the
  // small list React's style prop treats the same way) — everything else
  // gets "px" appended so a stray numeric style value (e.g. `{ width: 15 }`,
  // valid as a React style prop but meaningless as a raw DOM style value)
  // can't silently fall back to `auto` and blow an element up to its
  // content's intrinsic size.
  var UNITLESS_STYLE_PROPS = new Set(["opacity", "zIndex", "fontWeight", "lineHeight", "flex", "flexGrow", "flexShrink", "order", "zoom", "columnCount"]);

  // ---------------------------------------------------------------------
  // Minimal real-DOM element factory (drop-in for the old React.createElement
  // call sites — this app never needs virtual-dom diffing since each screen
  // is fully rebuilt on transition, so a real-node factory is a safe swap).
  // ---------------------------------------------------------------------
  function h(tag, props, children) {
    var el = document.createElement(tag);
    props = props || {};
    for (var key in props) {
      var val = props[key];
      if (val == null || key === "key") continue;
      if (key === "style") {
        for (var sk in val) {
          var sv = val[sk];
          if (typeof sv === "number" && sv !== 0 && !UNITLESS_STYLE_PROPS.has(sk)) sv = sv + "px";
          el.style[sk] = sv;
        }
      }
      else if (key === "className") { el.className = val; }
      else if (key === "dangerouslySetInnerHTML") { el.innerHTML = val.__html; }
      else if (key === "onClick") { el.addEventListener("click", val); }
      else if (key === "style-active") { /* handled via CSS :active classes */ }
      else if (key === "role" || key.indexOf("-") >= 0) { el.setAttribute(key, val); }
      else { el[key] = val; }
    }
    appendChildren(el, children);
    return el;
  }
  function appendChildren(el, children) {
    if (children == null || children === false) return;
    if (Array.isArray(children)) { for (var i = 0; i < children.length; i++) appendChildren(el, children[i]); return; }
    if (children instanceof Node) { el.appendChild(children); return; }
    el.appendChild(document.createTextNode(String(children)));
  }

  // ---------------------------------------------------------------------

  // ---------------------------------------------------------------------
  function Quiz(root) {
    this.root = root;
    this.state = { screen: 1, answers: {} };

  Quiz.prototype.QUESTIONS = {

    9: { key: "help_needed", title: "What do you want help with most?", subtitle: "Select all that apply.", back: true, multi: true,

      opts: [{ e: "🏡", l: "Remote" }, { e: "🔀", l: "Hybrid" }, { e: "🏢", l: "On-site" }, { e: "🌍", l: "I'm open to any" }] },

    20: { key: "interview_feeling", title: "When you think about your next interview, what do you feel?", subtitle: null, back: true,

  };

  Quiz.prototype.start = function () { this.enter(1); };
  Quiz.prototype.clear = function () { this._timers.forEach(function (t) { clearTimeout(t); }); this._timers = []; };
  Quiz.prototype.mount = function (node) { this.root.replaceChildren(node); };

  Quiz.prototype.track = function (name, props) {
    console.log("[track]", name, props || {});
    whenAmplitudeReady(function () {
      try { window.amplitude.track(name, props); } catch (e) { console.error(e); }
    });
  };

  Quiz.prototype.frames = function (dur, onUpdate, onDone) {
    var n = Math.max(1, Math.round(dur / 60));
    for (var i = 1; i <= n; i++) {
      (function (i) {
        this._timers.push(setTimeout(function () { onUpdate(i / n); if (i === n && onDone) onDone(); }, (dur / n) * i));
      }).call(this, i);
    }
  };

  Quiz.prototype.enter = function (n) {
    this.clear();
    this._refs = {};
    this.state.screen = n;
    this.mount(n === 1 ? this.buildWelcome() : this.buildScreen(n));
    var _sm = SCREEN_META[n] || { id: 'screen_' + n, text: '' };
    window.dataLayer.push({ event: 'quiz_step_view', question_id: _sm.id, question_text: _sm.text });
    if (n === 1) this.runWelcomeLoader();
    if (n === 6) this.runPersonalizing();
    if (n === 7) this.runFlash();
    if (n === 11) this.runNoticed();
    if (n === 23) this.runBuilding();
    if (n === 24) { this.runScore(); var self24 = this; this._timers.push(setTimeout(function () { self24.advanceFrom(24); }, 2600)); }
  };

  Quiz.prototype.go = function (n) { this._history.push(this.state.screen); this.enter(n); };
  Quiz.prototype.back = function () {
    while (this._history.length) {
      var prev = this._history.pop();
      if (!this.AUTO.has(prev)) { this.enter(prev); return; }
    }
  };
  Quiz.prototype.advanceFrom = function (n) { var nx = this.ORDER[this.ORDER.indexOf(n) + 1]; if (nx) this.go(nx); };
  Quiz.prototype.skip = function () { if (this.state.screen === 1) this.go(2); };

  // Repaints just the selected-state of the CURRENTLY mounted screen's option
  // cards (set up by the screen's own build*() function as this._refs.repaint).
  // Deliberately does NOT remount/replace the screen's DOM node — a full
  // remount would replay the screen's entrance animation (rc-fade + the
  // per-card stagger) on every single tap, which reads as a visible "jump"
  // each time an option (or, for multi-select, each option) is selected.
  Quiz.prototype.repaintSelection = function () {
    if (this._refs.repaint) this._refs.repaint();
  };

  Quiz.prototype.answer = function (key, value, fromScreen) {
    this.state.answers = Object.assign({}, this.state.answers, (function (o) { o[key] = value; return o; })({}));
    var _asm = SCREEN_META[fromScreen] || { id: 'screen_' + fromScreen, text: '' };
    window.dataLayer.push({ event: 'quiz_answer', question_id: _asm.id, question_text: _asm.text, selected_answer: value });
    this.repaintSelection();
    var self = this;
    this._timers.push(setTimeout(function () { self.advanceFrom(fromScreen); }, 260));
  };
  Quiz.prototype.toggle = function (key, value) {
    var cur = Array.isArray(this.state.answers[key]) ? this.state.answers[key].slice() : [];
    var idx = cur.indexOf(value);
    if (idx >= 0) cur.splice(idx, 1); else cur.push(value);
    this.state.answers = Object.assign({}, this.state.answers, (function (o) { o[key] = cur; return o; })({}));
    this.repaintSelection();
  };
  Quiz.prototype.toggleAll = function (key, allLabels) {
    var cur = Array.isArray(this.state.answers[key]) ? this.state.answers[key] : [];
    var full = cur.length === allLabels.length;
    var next = full ? [] : allLabels.slice();
    this.state.answers = Object.assign({}, this.state.answers, (function (o) { o[key] = next; return o; })({}));
    this.repaintSelection();
  };

  Quiz.prototype.computeScore = function () {
    var a = Object.values(this.state.answers).filter(function (v) { return v !== undefined && v !== ""; }).length;
    return a ? Math.min(89, 78 + 2 * a) : 89;
  };

  // ---------------- animation drivers (direct DOM refs — no full rebuild per frame) ----------------
  Quiz.prototype.runWelcomeLoader = function () {
    var self = this;
    this.frames(3800, function (p) { self._refs.loaderFill.style.width = (p * 100) + "%"; }, function () { self.go(2); });
  };
  Quiz.prototype.runPersonalizing = function () {
    var self = this, r = this._refs.ring, labels = this._refs.personalizingLabels;
    this.frames(4700, function (p) {
      var frac = Math.min(1, p);
      r.circle.setAttribute("stroke-dashoffset", (r.circ * (1 - frac)).toFixed(1));
      r.pctText.textContent = Math.round(frac * 100) + "%";
    });
    var cur = -1;
    function setLabel(idx) {
      idx = Math.min(idx, labels.length - 1);
      if (idx === cur) return;
      cur = idx;
      self._refs.personalizingLabelWrap.replaceChildren(
        h("div", { style: { fontSize: "14px", lineHeight: "20px", fontWeight: 600, color: "#1D1842", textAlign: "center", animation: "rc-fade .35s ease both" } }, labels[idx])
      );
    }
    setLabel(0);
    var i = 0;
    function stepOnce() {
      self.frames(1000, function () {}, function () {
        i++;
        setLabel(i);
        if (i < 4) self._timers.push(setTimeout(stepOnce, 180));
        else self._timers.push(setTimeout(function () { self.go(7); }, 180));
      });
    }
    stepOnce();
    this._timers.push(setTimeout(function () { if (self.state.screen === 6) self.go(7); }, 6200));
  };
  Quiz.prototype.runFlash = function () {
    var self = this, target = 2172899;
    this.frames(2500, function (p) {
      self._refs.counterEl.textContent = Math.round(target * (1 - Math.pow(1 - p, 3))).toLocaleString("en-US");
    });
  };
  Quiz.prototype.runNoticed = function () {
    var self = this, CH = 210;
    this.frames(560, function (p) {
      var pct = Math.round(92 * (1 - Math.pow(1 - p, 2)));
      self._refs.noticed.bar.style.height = Math.round(CH * (pct / 100)) + "px";
    }, function () { self._refs.noticed.emoji.style.display = "inline-flex"; });
  };
  Quiz.prototype.runBuilding = function () {
    var self = this, n = 5, fill = 850, stagger = 950, doneCount = 0;
    var refs = this._refs.building;
    var _loop = function (i) {
      self._timers.push(setTimeout(function () {
        refs[i].row.style.opacity = "1";
        self.frames(fill, function (p) {
          var pct = Math.round(p * 100);
          refs[i].barFill.style.width = pct + "%";
          refs[i].pctText.textContent = pct + "%";
        }, function () {
          // Elegant transition: shrink+fade the empty lead circle, then fade-in the green tick.
          refs[i].lead.style.transition = "opacity .28s ease, transform .28s ease";
          refs[i].lead.style.opacity = "0";
          refs[i].lead.style.transform = "scale(0.55)";
          self._timers.push(setTimeout(function () {
            var tick = self.markCircle(true, "20px");
            tick.style.animation = "rc-fade .38s ease both";
            refs[i].lead.replaceWith(tick);
            doneCount++;
            if (doneCount === n) self._timers.push(setTimeout(function () { self.go(24); }, 450));
          }, 260));
        });
      }, i * stagger));
    };
    for (var i = 0; i < n; i++) _loop(i);
  };
  Quiz.prototype.runScore = function () {
    var self = this, target = this.computeScore(), r = this._refs.score;
    this.frames(1100, function (p) {
      var score = Math.round(target * (1 - Math.pow(1 - p, 3)));
      var cat = score < 40 ? r.cats[0] : score < 60 ? r.cats[1] : score < 80 ? r.cats[2] : r.cats[3];
      r.badge.style.background = cat.c; r.badge.textContent = cat.n;
      r.bubbleText.textContent = String(score);
      r.bubble.style.left = score + "%";
      r.thumb.style.left = score + "%"; r.thumb.style.background = cat.c;
      r.subNumber.textContent = score + "%";
      r.lblEls.forEach(function (el, i) {
        var on = r.cats[i].n === cat.n;
        el.style.fontWeight = on ? "700" : "500";
        el.style.color = on ? "#061621" : "#7C8A94";
      });
    });
  };

  // ---------------- shared UI ----------------

    if (n === 24) return this.buildScore();
    if (n === 25) return this.buildFeelDifference();
    if (n === 26) return this.buildRecommendedResume();
    return null;
  };

  // ---------------------------------------------------------------------
  // Mount
  // ---------------------------------------------------------------------
  var root = document.getElementById("rc-quiz-root");
  var quiz = new Quiz(root);
  quiz.start();
})();
</script>
